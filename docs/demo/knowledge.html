</style></head><body><header><h1>OKF knowledge viewer</h1><span id="summary"></span></header><main><aside><label>Search <input id="search" type="search" autocomplete="off"></label><label>Type <select id="type"><option value="">All types</option></select></label><label><input id="show-graph" type="checkbox"> Show graph</label><div id="list" role="list"></div></aside><section id="detail" aria-live="polite"></section></main><script id="okf-data" type="application/json">{"exporter_version":"1","spec_version":"0.2","spec_revision":"date-3fcbb9f","reference_time":"2026-09-26","reference_basis":"explicit-civil-date","concepts":[{"id":"architecture","title":"Package boundaries","type":"Architecture Note","html":"\u003ch1\u003eWhere should an implementation change go?\u003c/h1\u003e\n\u003cp\u003eThis is a Go module with separate surfaces for bundle parsing, validation, graph projection, mutation, durable storage, CLI, and MCP. Start from the contract owned by the relevant package; a CLI or MCP adapter should expose it rather than inventing different OKF semantics.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e The module path is \u003ccode\u003egithub.com/skosovsky/okf\u003c/code\u003e.\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eFor a version-selection change, see \u003ca href=\"versions.md\"\u003eVersion resolution\u003c/a\u003e. For a write, follow the \u003ca href=\"mutation.md\"\u003eMutation boundary\u003c/a\u003e into the \u003ca href=\"store.md\"\u003eDurable store\u003c/a\u003e.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003eToolkit guide, package and surface map.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003eGo module declaration.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# Where should an implementation change go?\n\nThis is a Go module with separate surfaces for bundle parsing, validation, graph projection, mutation, durable storage, CLI, and MCP. Start from the contract owned by the relevant package; a CLI or MCP adapter should expose it rather than inventing different OKF semantics.[^toolkit] The module path is `github.com/skosovsky/okf`.[^module]\n\nFor a version-selection change, see [Version resolution](versions.md). For a write, follow the [Mutation boundary](mutation.md) into the [Durable store](store.md).\n\n[^toolkit]: Toolkit guide, package and surface map.\n[^module]: Go module declaration.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"toolkit","title":"Toolkit guide","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/toolkit.md"},{"id":"module","title":"Go module declaration","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/go.mod"}]},{"id":"computations","title":"Inert computations","type":"Architecture Note","html":"\u003ch1\u003eDoes reading an Attested Computation execute it?\u003c/h1\u003e\n\u003cp\u003eNo. The bundle and graph APIs expose a typed definition only for the exact \u003ccode\u003etype: Attested Computation\u003c/code\u003e; they do not execute its executor or attester, issue a runtime receipt, or infer a verdict.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e Resource fields and actor metadata grant no filesystem, network, shell, secret, or authentication authority. A separate trusted runtime and authorization would be needed to execute anything described by a bundle.\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eThe \u003ca href=\"graph.md\"\u003eGraph projections\u003c/a\u003e can describe the contract without crossing this boundary.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003eConformance matrix, computation and execution boundaries.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003eToolkit guide, security boundary.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# Does reading an Attested Computation execute it?\n\nNo. The bundle and graph APIs expose a typed definition only for the exact `type: Attested Computation`; they do not execute its executor or attester, issue a runtime receipt, or infer a verdict.[^matrix] Resource fields and actor metadata grant no filesystem, network, shell, secret, or authentication authority. A separate trusted runtime and authorization would be needed to execute anything described by a bundle.[^toolkit]\n\nThe [Graph projections](graph.md) can describe the contract without crossing this boundary.\n\n[^matrix]: Conformance matrix, computation and execution boundaries.\n[^toolkit]: Toolkit guide, security boundary.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"matrix","title":"OKF v0.2 conformance matrix","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/contracts/okf-v0.2-conformance.md"},{"id":"toolkit","title":"Toolkit security boundary","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/toolkit.md"}]},{"id":"graph","title":"Graph projections","type":"Architecture Note","html":"\u003ch1\u003eIs the JSON-LD vocabulary part of OKF?\u003c/h1\u003e\n\u003cp\u003eThe upstream OKF v0.2 document contract does not define an RDF ontology or JSON-LD context. This toolkit exposes an explicit \u003ccode\u003eskosovsky/okf\u003c/code\u003e graph profile and retains a legacy profile; declared/effective OKF version and graph profile version are separate.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e The projection draws from typed bundle data. Unknown YAML does not turn into invented predicates, and rendering does not run code or fetch network resources.\u003csup id=\"fnref1:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eFor computation nodes, see \u003ca href=\"computations.md\"\u003eInert computations\u003c/a\u003e.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003eADR 0001, scope and compatibility decision.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u0026#160;\u003ca href=\"#fnref1:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003e\u003ccode\u003egraph/projection.go\u003c/code\u003e, explicit projection metadata.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# Is the JSON-LD vocabulary part of OKF?\n\nThe upstream OKF v0.2 document contract does not define an RDF ontology or JSON-LD context. This toolkit exposes an explicit `skosovsky/okf` graph profile and retains a legacy profile; declared/effective OKF version and graph profile version are separate.[^adr][^projection] The projection draws from typed bundle data. Unknown YAML does not turn into invented predicates, and rendering does not run code or fetch network resources.[^adr]\n\nFor computation nodes, see [Inert computations](computations.md).\n\n[^adr]: ADR 0001, scope and compatibility decision.\n[^projection]: `graph/projection.go`, explicit projection metadata.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"adr","title":"Graph projection decision","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/adr/0001-okf-v02-graph-projection.md"},{"id":"projection","title":"Toolkit graph projection","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/graph/projection.go"}]},{"id":"mcp","title":"MCP contracts","type":"Architecture Note","html":"\u003ch1\u003eWhich MCP operation should an agent call?\u003c/h1\u003e\n\u003cp\u003eThe stdio server has thirteen tools.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e The original five read/write operations (\u003ccode\u003elist_concepts\u003c/code\u003e, \u003ccode\u003eread_concept\u003c/code\u003e, \u003ccode\u003evalidate_bundle\u003c/code\u003e, \u003ccode\u003eget_semantic_graph\u003c/code\u003e, \u003ccode\u003ewrite_concept\u003c/code\u003e) and the preview/apply pairs for concept patches and v0.2 migrations remain available.\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e\u003csup id=\"fnref:3\"\u003e\u003ca href=\"#fn:3\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e3\u003c/a\u003e\u003c/sup\u003e Two read-only operations add bounded concept search (\u003ccode\u003esearch_concepts\u003c/code\u003e) and incoming/outgoing neighbors (\u003ccode\u003eget_neighbors\u003c/code\u003e). Search ranks literal matches in ID and metadata ahead of body matches. Neighbors keep Markdown navigation, typed relations, and provenance source links distinct. Both report truncation and use a declared temporal profile when freshness is requested.\u003csup id=\"fnref:4\"\u003e\u003ca href=\"#fn:4\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e4\u003c/a\u003e\u003c/sup\u003e A third preview/apply pair upgrades a pinned bundle from date to instant temporal semantics.\u003csup id=\"fnref1:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e\u003csup id=\"fnref:5\"\u003e\u003ca href=\"#fn:5\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e5\u003c/a\u003e\u003c/sup\u003e Structured outputs follow checked-in schemas; apply operations require their respective preview evidence.\u003csup id=\"fnref1:3\"\u003e\u003ca href=\"#fn:3\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e3\u003c/a\u003e\u003c/sup\u003e\u003csup id=\"fnref1:5\"\u003e\u003ca href=\"#fn:5\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e5\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eUse \u003ca href=\"versions.md\"\u003eVersion resolution\u003c/a\u003e when selecting a reader contract and \u003ca href=\"mutation.md\"\u003eMutation boundary\u003c/a\u003e for write safety.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003eGo server registration at the pinned implementation commit.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u0026#160;\u003ca href=\"#fnref1:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003eToolkit guide, MCP tool list and proof rules.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:3\"\u003e\n\u003cp\u003eMCP tool schema definitions.\u0026#160;\u003ca href=\"#fnref:3\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u0026#160;\u003ca href=\"#fnref1:3\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:4\"\u003e\n\u003cp\u003eQuery contract at the pinned implementation commit.\u0026#160;\u003ca href=\"#fnref:4\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:5\"\u003e\n\u003cp\u003eTemporal upgrade apply schema at the pinned implementation commit.\u0026#160;\u003ca href=\"#fnref:5\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u0026#160;\u003ca href=\"#fnref1:5\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# Which MCP operation should an agent call?\n\nThe stdio server has thirteen tools.[^current-tools] The original five read/write operations (`list_concepts`, `read_concept`, `validate_bundle`, `get_semantic_graph`, `write_concept`) and the preview/apply pairs for concept patches and v0.2 migrations remain available.[^toolkit][^contracts] Two read-only operations add bounded concept search (`search_concepts`) and incoming/outgoing neighbors (`get_neighbors`). Search ranks literal matches in ID and metadata ahead of body matches. Neighbors keep Markdown navigation, typed relations, and provenance source links distinct. Both report truncation and use a declared temporal profile when freshness is requested.[^query-contract] A third preview/apply pair upgrades a pinned bundle from date to instant temporal semantics.[^current-tools][^upgrade-contract] Structured outputs follow checked-in schemas; apply operations require their respective preview evidence.[^contracts][^upgrade-contract]\n\nUse [Version resolution](versions.md) when selecting a reader contract and [Mutation boundary](mutation.md) for write safety.\n\n[^toolkit]: Toolkit guide, MCP tool list and proof rules.\n[^contracts]: MCP tool schema definitions.\n[^current-tools]: Go server registration at the pinned implementation commit.\n[^query-contract]: Query contract at the pinned implementation commit.\n[^upgrade-contract]: Temporal upgrade apply schema at the pinned implementation commit.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"toolkit","title":"Toolkit MCP guide","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/toolkit.md"},{"id":"contracts","title":"MCP tool contracts","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/internal/mcpserver/contracts.go"},{"id":"current-tools","title":"Current Go MCP tool registration","resource":"https://github.com/skosovsky/okf/blob/0f15ab4091203f11caa7fb0b9e02da47d719a051/internal/mcpserver/server.go"},{"id":"query-contract","title":"Current MCP concept query contract","resource":"https://github.com/skosovsky/okf/blob/0f15ab4091203f11caa7fb0b9e02da47d719a051/docs/contracts/concept-queries.md"},{"id":"upgrade-contract","title":"Current temporal upgrade apply contract","resource":"https://github.com/skosovsky/okf/blob/0f15ab4091203f11caa7fb0b9e02da47d719a051/internal/mcpserver/contracts/apply_temporal_upgrade.input.schema.json"}]},{"id":"mutation","title":"Mutation boundary","type":"Architecture Note","html":"\u003ch1\u003eWhere is the write boundary?\u003c/h1\u003e\n\u003cp\u003eA proposed edit becomes a typed \u003ccode\u003estore.ChangeSet\u003c/code\u003e operation, then a preview tied to an expected revision and plan digest, followed by an authorized apply through the store. The MCP patch path requires that preview evidence for apply.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e The Go operation union accepts documented concrete variants; unknown variants are rejected.\u003csup id=\"fnref:3\"\u003e\u003ca href=\"#fn:3\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e3\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eChangeSet format v1 remains the canonical envelope for request digests, journals, receipts and idempotency; adding distinct v0.2 operation tags did not change the envelope.\u003csup id=\"fnref1:3\"\u003e\u003ca href=\"#fn:3\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e3\u003c/a\u003e\u003c/sup\u003e Follow the \u003ca href=\"store.md\"\u003eDurable store\u003c/a\u003e for commit and recovery behavior.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003eToolkit guide, mutation and MCP apply contracts.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003e\u003ccode\u003estore/change.go\u003c/code\u003e, operation types and validation.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:3\"\u003e\n\u003cp\u003eADR 0002, ChangeSet v1 compatibility decision.\u0026#160;\u003ca href=\"#fnref:3\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u0026#160;\u003ca href=\"#fnref1:3\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# Where is the write boundary?\n\nA proposed edit becomes a typed `store.ChangeSet` operation, then a preview tied to an expected revision and plan digest, followed by an authorized apply through the store. The MCP patch path requires that preview evidence for apply.[^toolkit][^change] The Go operation union accepts documented concrete variants; unknown variants are rejected.[^adr]\n\nChangeSet format v1 remains the canonical envelope for request digests, journals, receipts and idempotency; adding distinct v0.2 operation tags did not change the envelope.[^adr] Follow the [Durable store](store.md) for commit and recovery behavior.\n\n[^toolkit]: Toolkit guide, mutation and MCP apply contracts.\n[^change]: `store/change.go`, operation types and validation.\n[^adr]: ADR 0002, ChangeSet v1 compatibility decision.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"toolkit","title":"Toolkit guide","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/toolkit.md"},{"id":"change","title":"ChangeSet operation contract","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/store/change.go"},{"id":"adr","title":"ChangeSet v1 operation-tag decision","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/adr/0002-changeset-v1-additive-operation-tags.md"}]},{"id":"platforms","title":"Supported platforms","type":"Architecture Note","html":"\u003ch1\u003eCan this host use the durable store?\u003c/h1\u003e\n\u003cp\u003eThe \u003ccode\u003estore/fs\u003c/code\u003e durable backend targets Darwin and Linux, subject to filesystem capability checks. Windows and other targets are compile-safe, but \u003ccode\u003eOpen\u003c/code\u003e and \u003ccode\u003eOpenContext\u003c/code\u003e return \u003ccode\u003e*fs.UnsupportedPlatformError\u003c/code\u003e rather than claiming durability.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e Callers can inspect it with \u003ccode\u003eerrors.Is(err, fs.ErrUnsupportedPlatform)\u003c/code\u003e and \u003ccode\u003eerrors.As\u003c/code\u003e.\u003csup id=\"fnref1:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eThis concerns the \u003ca href=\"store.md\"\u003eDurable store\u003c/a\u003e, not whether the read-only Go packages can compile.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003e\u003ccode\u003estore/fs/fs.go\u003c/code\u003e, package comment and unsupported-platform error.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003eRelease engineering contract, platform matrix.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u0026#160;\u003ca href=\"#fnref1:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# Can this host use the durable store?\n\nThe `store/fs` durable backend targets Darwin and Linux, subject to filesystem capability checks. Windows and other targets are compile-safe, but `Open` and `OpenContext` return `*fs.UnsupportedPlatformError` rather than claiming durability.[^fs][^release] Callers can inspect it with `errors.Is(err, fs.ErrUnsupportedPlatform)` and `errors.As`.[^release]\n\nThis concerns the [Durable store](store.md), not whether the read-only Go packages can compile.\n\n[^fs]: `store/fs/fs.go`, package comment and unsupported-platform error.\n[^release]: Release engineering contract, platform matrix.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"release","title":"Release engineering contract","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/release-engineering.md"},{"id":"fs","title":"Filesystem store platform contract","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/store/fs/fs.go"}]},{"id":"release","title":"Release evidence","type":"Architecture Note","html":"\u003ch1\u003eWhat evidence is needed before release?\u003c/h1\u003e\n\u003cp\u003eThe CI workflow supplies executable quality gates across supported Go targets and checks the release tag's relationship to \u003ccode\u003emain\u003c/code\u003e on version-tag pushes.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e A release record must link the issue, reviewable diff, commits, CI run, existing annotated tag, verification evidence, and remaining follow-ups.\u003csup id=\"fnref1:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e A draft release page does not establish that its future tag exists.\u003csup id=\"fnref2:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eThe platform matrix belongs to \u003ca href=\"platforms.md\"\u003eSupported platforms\u003c/a\u003e; the OKF format version is covered by \u003ca href=\"versions.md\"\u003eVersion resolution\u003c/a\u003e.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003eRelease engineering contract, CI and release-record requirements.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u0026#160;\u003ca href=\"#fnref1:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u0026#160;\u003ca href=\"#fnref2:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003eCI workflow implementation.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# What evidence is needed before release?\n\nThe CI workflow supplies executable quality gates across supported Go targets and checks the release tag's relationship to `main` on version-tag pushes.[^release][^workflow] A release record must link the issue, reviewable diff, commits, CI run, existing annotated tag, verification evidence, and remaining follow-ups.[^release] A draft release page does not establish that its future tag exists.[^release]\n\nThe platform matrix belongs to [Supported platforms](platforms.md); the OKF format version is covered by [Version resolution](versions.md).\n\n[^release]: Release engineering contract, CI and release-record requirements.\n[^workflow]: CI workflow implementation.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"release","title":"Release engineering contract","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/release-engineering.md"},{"id":"workflow","title":"CI workflow","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/.github/workflows/ci.yml"}]},{"id":"store","title":"Durable store","type":"Architecture Note","html":"\u003ch1\u003eWhat survives a failed or repeated write?\u003c/h1\u003e\n\u003cp\u003eThe filesystem backend coordinates writes with an advisory root-inode lock and uses a journal to complete an unfinished transaction to its recorded post-state before the next store observation or mutation.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e The \u003ccode\u003e.okf\u003c/code\u003e directory inside an opened bundle holds private staging and receipt metadata; it is not a place to author concepts.\u003csup id=\"fnref1:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e Preview and apply are bound to revision and plan evidence, and committed results carry store receipts distinct from computation receipts.\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eRead the \u003ca href=\"mutation.md\"\u003eMutation boundary\u003c/a\u003e before calling commit and \u003ca href=\"platforms.md\"\u003eSupported platforms\u003c/a\u003e before choosing a backend.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003e\u003ccode\u003estore/fs/fs.go\u003c/code\u003e, package contract and private directory.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u0026#160;\u003ca href=\"#fnref1:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003eToolkit guide, mutation durability and receipt distinction.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# What survives a failed or repeated write?\n\nThe filesystem backend coordinates writes with an advisory root-inode lock and uses a journal to complete an unfinished transaction to its recorded post-state before the next store observation or mutation.[^fs] The `.okf` directory inside an opened bundle holds private staging and receipt metadata; it is not a place to author concepts.[^fs] Preview and apply are bound to revision and plan evidence, and committed results carry store receipts distinct from computation receipts.[^toolkit]\n\nRead the [Mutation boundary](mutation.md) before calling commit and [Supported platforms](platforms.md) before choosing a backend.\n\n[^fs]: `store/fs/fs.go`, package contract and private directory.\n[^toolkit]: Toolkit guide, mutation durability and receipt distinction.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"fs","title":"Filesystem store implementation","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/store/fs/fs.go"},{"id":"toolkit","title":"Toolkit guide","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/toolkit.md"}]},{"id":"validation","title":"Validation policy","type":"Architecture Note","html":"\u003ch1\u003eDoes a warning make a bundle nonconformant?\u003c/h1\u003e\n\u003cp\u003eBase errors concern concept frontmatter and \u003ccode\u003etype\u003c/code\u003e, plus structure of present reserved \u003ccode\u003eindex.md\u003c/code\u003e and \u003ccode\u003elog.md\u003c/code\u003e. Optional provenance, lifecycle, computation and unknown extension fields do not become base errors solely because they are absent or unfamiliar.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e Strict validation checks present v0.2 families as guidance; links and orphan checks are opt-in. Staleness needs an explicit reference time, making CI results reproducible.\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eThe source of truth for a diagnostic code is the \u003ca href=\"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/contracts/okf-v0.2-conformance.md\"\u003econformance matrix\u003c/a\u003e. See \u003ca href=\"versions.md\"\u003eVersion resolution\u003c/a\u003e before interpreting a bundle.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003eConformance matrix, base and strict diagnostic boundaries.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003eToolkit guide, validation commands and flags.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# Does a warning make a bundle nonconformant?\n\nBase errors concern concept frontmatter and `type`, plus structure of present reserved `index.md` and `log.md`. Optional provenance, lifecycle, computation and unknown extension fields do not become base errors solely because they are absent or unfamiliar.[^matrix] Strict validation checks present v0.2 families as guidance; links and orphan checks are opt-in. Staleness needs an explicit reference time, making CI results reproducible.[^toolkit]\n\nThe source of truth for a diagnostic code is the [conformance matrix](https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/contracts/okf-v0.2-conformance.md). See [Version resolution](versions.md) before interpreting a bundle.\n\n[^matrix]: Conformance matrix, base and strict diagnostic boundaries.\n[^toolkit]: Toolkit guide, validation commands and flags.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"matrix","title":"OKF v0.2 conformance matrix","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/contracts/okf-v0.2-conformance.md"},{"id":"toolkit","title":"Toolkit guide","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/toolkit.md"}]},{"id":"versions","title":"Version resolution","type":"Architecture Note","html":"\u003ch1\u003eWhich version controls this bundle?\u003c/h1\u003e\n\u003cp\u003eThe root \u003ccode\u003eindex.md\u003c/code\u003e declares the OKF document contract with \u003ccode\u003eokf_version\u003c/code\u003e; a Go module release or plugin package version does not select that contract.\u003csup id=\"fnref:1\"\u003e\u003ca href=\"#fn:1\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e1\u003c/a\u003e\u003c/sup\u003e The resolver keeps the declared version, effective reader version, selection source, and compatibility mode separately. An absent declaration defaults to v0.2; a supported explicit selector is an assertion, and a conflict fails. A canonical unknown future declaration remains visible while the reader uses best-effort v0.2 semantics.\u003csup id=\"fnref:2\"\u003e\u003ca href=\"#fn:2\" class=\"footnote-ref\" role=\"doc-noteref\"\u003e2\u003c/a\u003e\u003c/sup\u003e\u003c/p\u003e\n\u003cp\u003eThis bundle declares \u003ccode\u003e0.2\u003c/code\u003e in its root index. See \u003ca href=\"validation.md\"\u003eValidation policy\u003c/a\u003e for malformed declarations.\u003c/p\u003e\n\u003cdiv class=\"footnotes\" role=\"doc-endnotes\"\u003e\n\u003chr\u003e\n\u003col\u003e\n\u003cli id=\"fn:1\"\u003e\n\u003cp\u003eToolkit guide, version axes and resolution rules.\u0026#160;\u003ca href=\"#fnref:1\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003cli id=\"fn:2\"\u003e\n\u003cp\u003e\u003ccode\u003ebundle/version.go\u003c/code\u003e, \u003ccode\u003eVersionResolution\u003c/code\u003e and \u003ccode\u003eResolveVersion\u003c/code\u003e.\u0026#160;\u003ca href=\"#fnref:2\" class=\"footnote-backref\" role=\"doc-backlink\"\u003e\u0026#x21a9;\u0026#xfe0e;\u003c/a\u003e\u003c/p\u003e\n\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/div\u003e\n","search_text":"# Which version controls this bundle?\n\nThe root `index.md` declares the OKF document contract with `okf_version`; a Go module release or plugin package version does not select that contract.[^toolkit] The resolver keeps the declared version, effective reader version, selection source, and compatibility mode separately. An absent declaration defaults to v0.2; a supported explicit selector is an assertion, and a conflict fails. A canonical unknown future declaration remains visible while the reader uses best-effort v0.2 semantics.[^version-code]\n\nThis bundle declares `0.2` in its root index. See [Validation policy](validation.md) for malformed declarations.\n\n[^version-code]: `bundle/version.go`, `VersionResolution` and `ResolveVersion`.\n[^toolkit]: Toolkit guide, version axes and resolution rules.","trust":"unverified","status":"draft","staleness":"unevaluated","sources":[{"id":"version-code","title":"Bundle version resolver","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/bundle/version.go"},{"id":"toolkit","title":"Toolkit guide","resource":"https://github.com/skosovsky/okf/blob/ed7ddc28cd127682023bd150ee377906b817e099/docs/toolkit.md"}]}],"edges":[{"from":"architecture","to":"mutation","from_concept":"architecture","to_concept":"mutation","kind":"markdown","exists":true,"raw":"mutation.md"},{"from":"architecture","to":"store","from_concept":"architecture","to_concept":"store","kind":"markdown","exists":true,"raw":"store.md"},{"from":"architecture","to":"versions","from_concept":"architecture","to_concept":"versions","kind":"markdown","exists":true,"raw":"versions.md"},{"from":"computations","to":"graph","from_concept":"computations","to_concept":"graph","kind":"markdown","exists":true,"raw":"graph.md"},{"from":"graph","to":"computations","from_concept":"graph","to_concept":"computations","kind":"markdown","exists":true,"raw":"computations.md"},{"from":"mcp","to":"mutation","from_concept":"mcp","to_concept":"mutation","kind":"markdown","exists":true,"raw":"mutation.md"},{"from":"mcp","to":"versions","from_concept":"mcp","to_concept":"versions","kind":"markdown","exists":true,"raw":"versions.md"},{"from":"mutation","to":"store","from_concept":"mutation","to_concept":"store","kind":"markdown","exists":true,"raw":"store.md"},{"from":"platforms","to":"store","from_concept":"platforms","to_concept":"store","kind":"markdown","exists":true,"raw":"store.md"},{"from":"release","to":"platforms","from_concept":"release","to_concept":"platforms","kind":"markdown","exists":true,"raw":"platforms.md"},{"from":"release","to":"versions","from_concept":"release","to_concept":"versions","kind":"markdown","exists":true,"raw":"versions.md"},{"from":"store","to":"mutation","from_concept":"store","to_concept":"mutation","kind":"markdown","exists":true,"raw":"mutation.md"},{"from":"store","to":"platforms","from_concept":"store","to_concept":"platforms","kind":"markdown","exists":true,"raw":"platforms.md"},{"from":"validation","to":"versions","from_concept":"validation","to_concept":"versions","kind":"markdown","exists":true,"raw":"versions.md"},{"from":"versions","to":"validation","from_concept":"versions","to_concept":"validation","kind":"markdown","exists":true,"raw":"validation.md"}]}</script><script>/* OKF viewer assets: original work; no third-party dependencies or fetches. */
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('okf-data').textContent);
  const concepts = new Map(data.concepts.map(c => [c.id, c]));
  const byId = document.getElementById('detail');
  const list = document.getElementById('list');
  const search = document.getElementById('search');
  const type = document.getElementById('type');
  const showGraph = document.getElementById('show-graph');
  const summary = document.getElementById('summary');
  summary.textContent = data.concepts.length + ' concepts · ' + data.edges.length + ' edges · OKF ' + data.spec_version + ' · staleness: ' + data.reference_basis + (data.reference_time ? ' (' + data.reference_time + ')' : '');
  [...new Set(data.concepts.map(c => c.type).filter(Boolean))].sort().forEach(t => {
    const option = document.createElement('option'); option.value = t; option.textContent = t; type.append(option);
  });
  const el = (tag, cls, content) => {
    const item = document.createElement(tag); if (cls) item.className = cls;
    if (content != null) item.textContent = content; return item;
  };
  const navigate = id => { location.hash = encodeURIComponent(id); };
  const edgeRow = (e, outgoing) => {
    const target = outgoing ? e.to_concept : e.from_concept;
    const reference = outgoing ? e.to : e.from;
    const row = el('div', 'edge' + (e.exists ? '' : ' missing'));
    row.append(el('span', 'badge', e.kind + (outgoing ? ' → ' : ' ← ')));
    if (concepts.has(target)) {
      const button = el('button', '', reference); button.addEventListener('click', () => navigate(target)); row.append(button);
    } else row.append(el('span', '', reference + ' (missing)'));
    return row;
  };
  const render = () => {
    let id = '';
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (_) { id = ''; }
    // A valid concept route wins over Goldmark's footnote anchor namespace.
    if (!concepts.has(id) && /^fn(?:ref\d*)?:/i.test(id) && Array.from(byId.querySelectorAll('[id]')).some(anchor => anchor.id === id)) return;
    const c = concepts.get(id) || data.concepts[0];
    byId.replaceChildren();
    if (!c) { byId.append(el('p', 'empty', 'This bundle contains no concepts.')); return; }
    byId.append(el('h2', '', c.title), el('code', '', c.id));
    const meta = el('div', 'meta');
    [
      [c.type || 'type unknown', false],
      ['trust: ' + c.trust, false],
      ['status: ' + c.status, c.status === 'deprecated' || c.status === 'invalid'],
      ['staleness: ' + c.staleness, c.staleness === 'stale' || c.staleness === 'invalid']
    ].forEach(([value, alert]) => meta.append(el('span', 'badge' + (alert ? ' stale' : ''), value)));
    byId.append(meta);
    if (c.stale_after) byId.append(el('p', '', 'Stale after: ' + c.stale_after));
    const body = el('div', 'body'); body.innerHTML = c.html; byId.append(body);
    // Bundle resolution comes from Go. Relative Markdown links use concept deep links.
    const markdownLinks = data.edges.filter(e => e.kind === 'markdown' && e.from_concept === c.id);
    body.querySelectorAll('a').forEach(a => {
      const raw = a.getAttribute('href') || '';
      const normalized = value => { try { return decodeURI(value); } catch (_) { return value; } };
      const edge = markdownLinks.find(e => e.raw === raw || normalized(e.raw) === normalized(raw));
      if (edge && edge.exists && concepts.has(edge.to_concept)) {
        a.href = '#' + encodeURIComponent(edge.to_concept);
      } else if (edge) {
        a.removeAttribute('href'); a.title = 'Missing concept';
      } else if (/^#fn(?:ref\d*)?:/i.test(raw)) {
        // Goldmark footnotes link to anchors in the current detail card.
        a.addEventListener('click', event => {
          const target = document.getElementById(raw.slice(1));
          if (target) { event.preventDefault(); target.scrollIntoView(); }
        });
      } else if (/^(https?:\/\/|mailto:)/i.test(raw) && !/[\u0000-\u001f\u007f]/.test(raw)) {
        a.rel = 'noopener noreferrer'; a.referrerPolicy = 'no-referrer';
      } else {
        a.removeAttribute('href'); a.title = 'Unresolved link';
      }
    });
    byId.append(el('h3', '', 'Sources'));
    if (!c.sources.length) byId.append(el('p', 'empty', 'No sources recorded.'));
    c.sources.forEach(s => {
      const row = el('div', 'source', (s.title || s.id || 'Source') + (s.resource ? ' · ' : ''));
      if (/^(https?:\/\/|mailto:)/i.test(s.resource) && !/[\u0000-\u001f\u007f]/.test(s.resource)) {
        const a = el('a', '', s.resource); a.href = s.resource; a.rel = 'noopener noreferrer'; a.referrerPolicy = 'no-referrer'; row.append(a);
      } else row.append(el('span', '', s.resource));
      byId.append(row);
    });
    const outgoing = data.edges.filter(e => e.from_concept === c.id);
    const incoming = data.edges.filter(e => e.to_concept === c.id);
    byId.append(el('h3', '', 'Outgoing')); if (!outgoing.length) byId.append(el('p', 'empty', 'None.')); outgoing.forEach(e => byId.append(edgeRow(e, true)));
    byId.append(el('h3', '', 'Incoming')); if (!incoming.length) byId.append(el('p', 'empty', 'None.')); incoming.forEach(e => byId.append(edgeRow(e, false)));
    if (showGraph.checked) {
      const panel = el('div', 'graph'); panel.append(el('strong', '', 'Local graph · ' + (outgoing.length + incoming.length) + ' connections'));
      const nearby = [...outgoing, ...incoming].slice(0, 200);
      const ids = [...new Set(nearby.map(e => e.from_concept === c.id ? e.to_concept : e.from_concept))].slice(0, 48);
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 600 360'); svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Local relationship diagram for ' + c.id);
      const svgEl = (tag, attrs) => {
        const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));
        return node;
      };
      const center = svgEl('circle', {cx:300,cy:180,r:27,fill:'#155da0'});
      svg.append(center);
      const centerText = svgEl('text', {x:300,y:185,'text-anchor':'middle',fill:'#fff','font-size':11});
      centerText.textContent = 'current'; svg.append(centerText);
      ids.forEach((id, index) => {
        const angle = index * Math.PI * 2 / ids.length - Math.PI / 2;
        const x = 300 + 245 * Math.cos(angle), y = 180 + 135 * Math.sin(angle);
        svg.append(svgEl('line', {x1:300,y1:180,x2:x,y2:y,stroke:'#8294aa','stroke-width':1.5}));
        const point = svgEl('circle', {cx:x,cy:y,r:14,fill:concepts.has(id)?'#55a3c8':'#b56f6f'});
        if (concepts.has(id)) {point.style.cursor='pointer'; point.addEventListener('click', () => navigate(id));}
        svg.append(point);
        const label = svgEl('text', {x:x,y:y-19,'text-anchor':'middle','font-size':10,fill:'#172335'});
        label.textContent = id.length > 25 ? id.slice(0,22) + '…' : id; svg.append(label);
      });
      if (ids.length) panel.append(svg);
      nearby.forEach(e => panel.append(edgeRow(e, e.from_concept === c.id)));
      if (new Set(nearby.map(e => e.from_concept === c.id ? e.to_concept : e.from_concept)).size > 48) panel.append(el('p', 'empty', 'Diagram shows first 48 neighbors; the list below shows up to 200.'));
      if (outgoing.length + incoming.length > 200) panel.append(el('p', 'empty', 'Showing first 200 connections; use the edge lists above for all.'));
      byId.append(el('h3', '', 'Graph'), panel);
    }
    list.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.id === c.id));
  };
  const updateList = () => {
    const q = search.value.toLocaleLowerCase(); const t = type.value;
    list.replaceChildren();
    let count = 0;
    for (const c of data.concepts) {
      if (t && c.type !== t) continue;
      if (q && !(c.id + ' ' + c.title + ' ' + c.type + ' ' + c.search_text).toLocaleLowerCase().includes(q)) continue;
      count++;
      const button = el('button', '', c.title); button.dataset.id = c.id;
      button.append(el('small', '', c.id + (c.type ? ' · ' + c.type : '')));
      button.addEventListener('click', () => navigate(c.id)); list.append(button);
    }
    if (!count) list.append(el('p', 'empty', 'No matching concepts.'));
    render();
  };
  search.addEventListener('input', updateList); type.addEventListener('change', updateList);
  showGraph.addEventListener('change', render); addEventListener('hashchange', render);
  updateList();
})();
</script></body></html>
