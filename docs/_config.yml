title: Open Knowledge Format
description: Keep project rules and decisions in Markdown with links to their sources.
theme: jekyll-theme-minimal
repository: skosovsky/okf
url: https://skosovsky.github.io
baseurl: /okf
show_downloads: false

github:
  repository_url: https://github.com/skosovsky/okf

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

  - scope:
      path: "ru"
    values:
      lang: ru
      title: OKF — знания проекта
      description: Правила и решения проекта в Markdown со ссылками на источники.
