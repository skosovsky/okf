name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, vet, and module integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify downloaded modules
        run: go mod verify
      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Test viewer routes and interface languages
        run: node viewer/testdata/regression-016/routes.cjs
      - name: Test skill package negative fixtures
        run: node --test scripts/check-skill-package.test.mjs
      - name: Check standalone skill installation and dependency lock
        run: node scripts/check-skill-package.mjs
      - name: Test whitespace gate
        run: bash .github/scripts/check-whitespace_test.sh
      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MAIN_REF: refs/remotes/origin/main
          REF_TYPE: ${{ github.ref_type }}
        run: bash .github/scripts/check-whitespace.sh
      - name: Vet packages
        run: go vet ./...
      - name: Test packages
        run: go test ./...
      - name: Validate repository knowledge bundle
        run: go run ./cmd/okf validate --path knowledge --spec auto --strict --check-links --check-orphans --as-of 2026-09-26 --max-warnings=0 --json
      - name: Verify published knowledge viewer snapshot
        run: |
          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "$snapshot_dir"' EXIT
          ./scripts/build-viewer-demo.sh "$snapshot_dir/knowledge.html"
          cmp docs/demo/knowledge.html "$snapshot_dir/knowledge.html"
      - name: Verify localized project viewer snapshots and reproducibility
        run: |
          snapshot_dir="$(mktemp -d)"
          trap 'rm -rf "$snapshot_dir"' EXIT
          for language in en ru; do
            ./scripts/build-project-demo.sh "$language" "$snapshot_dir/project-$language-first.html"
            ./scripts/build-project-demo.sh "$language" "$snapshot_dir/project-$language-second.html"
            cmp "$snapshot_dir/project-$language-first.html" "$snapshot_dir/project-$language-second.html"
            cmp "docs/demo/project-$language.html" "$snapshot_dir/project-$language-first.html"
          done
      - name: Build knowledge viewer
        run: go run ./cmd/okf view knowledge --output "$RUNNER_TEMP/knowledge-view.html" --spec auto --as-of 2026-09-26
      - name: Upload knowledge viewer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-viewer
          path: ${{ runner.temp }}/knowledge-view.html
          if-no-files-found: error
      - name: Build Linux packages
        run: go build ./...

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test packages with race detector
        run: go test -race ./...

  darwin:
    name: Darwin durable backend
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test platform-specific filesystem behavior
        run: go test ./store/fs
      - name: Build Darwin packages
        run: go build ./...

  unsupported-platform:
    name: Unsupported platform contract (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build all packages for Windows
        run: go build ./...
      - name: Test typed unsupported-platform contract
        run: go test ./store/fs -run "UnsupportedPlatform|CancellationPrecedesPlatform" -count=1

  derived-platform:
    name: Compile-safe derived platform (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build all packages without selecting the Linux backend
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Assert Android selects the unsupported backend
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          files="$(go list -f '{{join .GoFiles " "}}' ./store/fs)"
          [[ " $files " == *" fd_unsupported.go "* ]]
          [[ " $files " != *" fd_unix.go "* ]]
      - name: Assert iOS selects the unsupported backend
        env:
          GOOS: ios
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          files="$(go list -f '{{join .GoFiles " "}}' ./store/fs)"
          [[ " $files " == *" fd_unsupported.go "* ]]
          [[ " $files " != *" fd_unix.go "* ]]
