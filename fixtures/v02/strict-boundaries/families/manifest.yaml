description: "Strict v0.2 boundary diagnostics expose exact machine tuples"
run:
  path: "."
  strict: true
  check_links: false
  check_orphans: false
expected:
  exit_code: 0
  diagnostics:
    - severity: "WARN"
      message_contains: "'generated.by' should follow the OKF actor convention"
      code: "actor_invalid"
      spec_ref: "okf-v0.2#7"
      field_path: "generated.by"
    - severity: "WARN"
      message_contains: "'generated.at' should be RFC3339"
      code: "generated_at_invalid"
      spec_ref: "okf-v0.2#5.2"
      field_path: "generated.at"
    - severity: "WARN"
      message_contains: "inline computation mode permits exactly one"
      code: "computation_inline_multiple"
      spec_ref: "okf-v0.2#10.3"
      field_path: "body.# Computation"
    - severity: "WARN"
      message_contains: "'executor.receipt' should contain at least one field name"
      code: "receipt_invalid"
      spec_ref: "okf-v0.2#10.2"
      field_path: "executor.receipt"
    - severity: "WARN"
      message_contains: "should be a non-negative integer"
      code: "source_usage_count_invalid"
      spec_ref: "toolkit#sources-usage-profile"
      field_path: "sources[0].usage_count"
    - severity: "WARN"
      message_contains: "requires a valid effective usage_window"
      code: "source_usage_window_missing"
      spec_ref: "toolkit#sources-usage-profile"
      field_path: "sources[1].usage_count"
    - severity: "WARN"
      message_contains: "should be on or before"
      code: "usage_window_order"
      spec_ref: "toolkit#sources-usage-profile"
      field_path: "sources[1].usage_window"
    - severity: "WARN"
      message_contains: "'tags[1]' should be a non-empty string"
      code: "tags_invalid"
      spec_ref: "okf-v0.2#4.1"
      field_path: "tags[1]"
    - severity: "WARN"
      message_contains: "'timestamp' should be RFC3339"
      code: "timestamp_invalid"
      spec_ref: "okf-v0.2#13.1"
      field_path: "timestamp"
